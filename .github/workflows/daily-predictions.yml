# Daily conjunction prediction pipeline
# Runs at 00:00 UTC every day, fetching TLEs, screening pairs,
# logging predictions, and validating yesterday's results.
name: Daily Predictions

on:
  schedule:
    - cron: '0 0 * * *'  # Every day at midnight UTC
  workflow_dispatch:  # Manual trigger for testing

permissions:
  contents: write  # For pushing prediction logs
  pages: write     # For deploying webapp to GitHub Pages
  id-token: write  # For Pages deployment token

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history so we can push back

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests numpy scipy sgp4 spacetrack
          pip install google-cloud-firestore google-auth || echo "Firebase SDK install failed (optional)"
          pip install huggingface-hub || echo "HF Hub install failed (optional)"
          pip install scikit-learn xgboost || true
          pip install torch --index-url https://download.pytorch.org/whl/cpu || true

      - name: Verify baseline model
        run: |
          if [ -f models/baseline.json ]; then
            echo "Baseline model found ($(wc -c < models/baseline.json) bytes)"
          else
            echo "WARNING: models/baseline.json not found in repo"
            echo "Predictions will use heuristic scoring fallback"
          fi

      - name: Run daily predictions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACETRACK_USER: ${{ secrets.SPACETRACK_USER }}
          SPACETRACK_PASS: ${{ secrets.SPACETRACK_PASS }}
        run: |
          python scripts/daily_predictions.py --top-k 500

      - name: Prune old TLE snapshots
        run: |
          # Keep only last 2 snapshots (today + yesterday) to avoid repo bloat
          # Each snapshot is ~6MB; without pruning = 2.3GB/year in git history
          cd data/tle_snapshots
          ls -1 *.json 2>/dev/null | sort | head -n -2 | xargs -r rm -v
          cd ../..

      - name: Prune maneuver history
        env:
          HISTORY_FILE: data/prediction_logs/maneuver_history.jsonl
        run: |
          # Keep last 90 days of maneuver history (needed for stationkeeping detection)
          # ~537 maneuvers/day × 500 bytes = ~260KB/day; 90 days ≈ 23MB max
          if [ -f "$HISTORY_FILE" ]; then
            CUTOFF=$(date -u -d '90 days ago' +%Y-%m-%dT 2>/dev/null || date -u -v-90d +%Y-%m-%dT)
            export CUTOFF
            python << 'PYEOF'
          import json, os
          hf = os.environ["HISTORY_FILE"]
          cutoff = os.environ["CUTOFF"]
          with open(hf) as f:
              lines = f.readlines()
          kept = 0
          with open(hf, "w") as f:
              for line in lines:
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      rec = json.loads(line)
                      if rec.get("detected_at", "") >= cutoff:
                          f.write(line + "\n")
                          kept += 1
                  except json.JSONDecodeError:
                      continue
          print(f"  Maneuver history: kept {kept}/{len(lines)} records (cutoff {cutoff})")
          PYEOF
          fi

      - name: Generate paper figures
        run: |
          pip install matplotlib seaborn 2>/dev/null || true
          python scripts/generate_figures.py || echo "Figure generation failed (non-critical)"

      - name: Commit and push prediction logs
        run: |
          git config user.name "Panacea Bot"
          git config user.email "panacea-bot@users.noreply.github.com"
          # Force-add in case gitignore still interferes
          git add -f data/prediction_logs/ data/tle_snapshots/ 2>/dev/null || true
          git add -f writeup/figures/ 2>/dev/null || true
          # Stage webapp alerts and TLE fallback (consumed by frontend)
          git add -f webapp-react/public/latest_alerts.json 2>/dev/null || true
          git add -f webapp-react/public/latest_tles.json 2>/dev/null || true
          git add -f webapp-react/public/pipeline_stats.json 2>/dev/null || true
          git add -f webapp-react/public/cdm_forecast.json 2>/dev/null || true
          git add -f models/cdm_lstm.pt 2>/dev/null || true
          git add -f models/cdm_sequence_model.pt 2>/dev/null || true
          git add -f models/cdm_forecast.json 2>/dev/null || true
          # Also stage deletions of pruned snapshots
          git add -u data/tle_snapshots/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m ":robot: Daily predictions $(date -u +%Y-%m-%d)"
          git push || echo "Push failed (non-critical)"

  # Rebuild and deploy webapp to GitHub Pages with fresh alerts data.
  # Bot commits from the predict job don't trigger deploy-webapp.yml
  # (GitHub Actions ignores GITHUB_TOKEN pushes to prevent loops),
  # so we deploy directly here instead.
  deploy-webapp:
    needs: predict
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Pull latest (includes bot commit with fresh alerts)
        run: git pull origin main

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp-react/package-lock.json

      - name: Get API URL from git notes
        id: api-url
        run: |
          git fetch origin "refs/notes/*:refs/notes/*" 2>/dev/null || true
          FIRST_COMMIT=$(git rev-list --max-parents=0 HEAD)
          TUNNEL_URL=$(git notes show "$FIRST_COMMIT" 2>/dev/null || echo "")
          echo "url=$TUNNEL_URL" >> "$GITHUB_OUTPUT"

      - name: Install and build
        working-directory: webapp-react
        env:
          VITE_API_URL: ${{ steps.api-url.outputs.url || 'https://dtanzillo-panacea-api.hf.space' }}
        run: |
          npm ci
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: webapp-react/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
