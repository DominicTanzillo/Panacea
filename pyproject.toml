[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "panacea-ssa"
version = "0.1.0"
description = "ML-based satellite conjunction assessment from public CDM data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Dominic Tanzillo", email = "dominic.tanzillo@duke.edu"},
]
keywords = ["space-situational-awareness", "conjunction-assessment", "cdm", "collision-avoidance", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
full = [
    "torch>=2.0.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "sgp4>=2.20",
    "spacetrack>=1.0.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
]

[project.scripts]
panacea = "src.cli:main"

[project.urls]
Homepage = "https://github.com/DominicTanzillo/Panacea"
Repository = "https://github.com/DominicTanzillo/Panacea"

[tool.setuptools.packages.find]
include = ["src*"]
